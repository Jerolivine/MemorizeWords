<div class="container">
    <div class="empty-column"></div>
    <div class="grid">

        <div class="width-full bottom-divider top-divider">
            <button class="btn btn-info width-full" (click)="addNewWordClick()">Add New Word</button>
        </div>

        <div class="width-full bottom-divider">
            <button type="button" class="btn btn-success width-full" (click)="askMeanings()">Ask The Meanings</button>
        </div>

        <div class="width-full bottom-divider">
            <button type="button" class="btn btn-success width-full" (click)="askWords()">Ask The Words</button>
        </div>

        <answers [refreshData$]="refreshAnswers$" [userGuessedWordsHub$]="userGuessedWordsHub$"></answers>
    </div>
    <div class="empty-column"></div>
</div>
